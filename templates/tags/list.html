{% extends "base.html" %}

{% block title %}Tags · {{ config.title }}{% endblock title %}

{% block content %}
<article class="section-page">
  <header class="page-header">
    <h1>Tags</h1>
  </header>
  <ul class="tag-index">
    {% for term in terms %}
      <li>
        <a href="{{ term.permalink | safe }}">{{ term.name }}</a>
        <span class="count">{{ term.pages | length }}</span>
      </li>
    {% endfor %}
  </ul>
</article>
{% endblock content %}
